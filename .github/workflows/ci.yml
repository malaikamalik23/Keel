name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit + API tests
        run: pytest -q --ignore=tests/injection
      - name: Prompt-injection red-team suite
        run: pytest -q tests/injection

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test        # renders every tab against a mocked API (jsdom)
      - run: npm run build   # type-checks, then builds

  e2e:
    # The dashboard in real headless Chromium against the real server (scripted LLM). Catches what jsdom can't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pytest tests/e2e -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit semgrep
      - name: Bandit (common Python security mistakes)
        run: bandit -q -r app scripts evals
      - name: Semgrep (python, security-audit and secrets rule sets)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets --metrics=off --error
          app scripts evals Dockerfile docker-compose.yml .github

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t keel:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name keel -p 8000:8000 keel:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs keel; exit 1
      - name: The commands in docs/DEPLOY.md work (compose, API key, backup, restore)
        env:
          API_KEY: ci-only-not-a-secret
        run: |
          docker rm -f keel
          docker compose up -d --build
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/tasks)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $API_KEY" http://127.0.0.1:8000/api/tasks)" = 200
          docker compose exec -T keel python -m scripts.backup
          mkdir -p "$HOME/keel-backups" && docker compose cp keel:/app/data/backups/. "$HOME/keel-backups/"
          backup="$(ls "$HOME/keel-backups" | grep '\.db$' | head -1)" && test -n "$backup"
          docker compose stop keel
          chmod 700 "$HOME/keel-backups"
          docker compose run --rm --no-deps -T keel sh -c 'cat > /app/data/agent.db' < "$HOME/keel-backups/$backup"
          docker compose up -d
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $API_KEY" http://127.0.0.1:8000/api/tasks)" = 200 || { docker compose logs keel; exit 1; }
