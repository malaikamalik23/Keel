name: Tool-routing eval (manual)

# Costs real API calls, so it never runs automatically. Trigger it from the Actions tab after changing a tool
# description or the system prompt. Add ANTHROPIC_API_KEY (or GROQ_API_KEY) as a repository secret first.
on:
  workflow_dispatch:
    inputs:
      min_score:
        description: Fail below this score (0-1)
        default: "0.85"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m evals.run_routing --min-score ${{ inputs.min_score }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-eval-results
          path: evals/results/
