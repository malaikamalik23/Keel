[project]
name = "keel"
version = "1.0.0"
description = "A self-hosted personal AI agent that remembers your commitments, plans realistic days, and follows up."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["frontend", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "E501",   # long lines are fine in tool descriptions and prompts
  "B008",   # FastAPI's Depends() in defaults is the documented pattern
  "S101",   # asserts are fine (tests; invariants)
  "UP007", "UP045",
  "UP042",  # (str, Enum) keeps values JSON/pydantic-friendly; StrEnum would change behaviour for no gain
  "S608",   # f-string SQL: only used with fixed fragments and bound parameters (see services/documents.py)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "B017", "B023", "E731", "E702", "E741", "I001"]
"evals/**" = ["S"]
